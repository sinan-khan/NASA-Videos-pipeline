name: Auto Space Video

on:
  schedule:
    - cron: '0 12,18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate a video without uploading to YouTube
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-space-video
  cancel-in-progress: false

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Run the pipeline
        id: pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: ${{ secrets.YT_PRIVACY_STATUS }}
          YT_LANGUAGE: ${{ secrets.YT_LANGUAGE }}
          YT_CATEGORY_ID: ${{ secrets.YT_CATEGORY_ID }}
          CHANNEL_HANDLE: ${{ secrets.CHANNEL_HANDLE }}
          VIDEO_VOICE: ${{ secrets.VIDEO_VOICE }}
          MUSIC_URL: ${{ secrets.MUSIC_URL }}
          MUSIC_VOLUME: ${{ secrets.MUSIC_VOLUME }}
          TARGET_SECONDS: ${{ secrets.TARGET_SECONDS }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || secrets.DRY_RUN }}
        run: python main.py

      - name: Upload video and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output-${{ github.run_id }}
          path: |
            output/final.mp4
            output/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit topic state back to the repo
        if: success() && steps.pipeline.outcome == 'success' && env.DRY_RUN != '1' && env.DRY_RUN != 'true'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || secrets.DRY_RUN }}
        run: |
          git config user.name "Auto Space Video Bot"
          git config user.email "actions@github.com"
          git add used-topics.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: record used topic after video run"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Notify on failure
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          if [ -n "${NOTIFY_WEBHOOK}" ]; then
            python - <<'EOF'
            import json, os, urllib.request
            payload = {"content": "Auto Space Video pipeline FAILED. Check the GitHub Actions run."}
            req = urllib.request.Request(
                os.environ["NOTIFY_WEBHOOK"],
                data=json.dumps(payload).encode(),
                headers={"Content-Type": "application/json"},
            )
            urllib.request.urlopen(req, timeout=15).read()
            EOF
          fi
