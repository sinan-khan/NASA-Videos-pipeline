name: NASA Videos Pipeline

on:
  # Exactly like History-Shorts-Pipeline: one production run per day.
  # The pipeline publishes 1 Short every day and a long-form documentary
  # every 48 hours based on persisted publishing state.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional: force a specific Short topic'
        required: false
        default: ''
        type: string
      dry_run:
        description: Build and validate without uploading or advancing publishing state
        required: false
        default: false
        type: boolean

concurrency:
  group: nasa-videos-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run NASA production pipeline
        id: pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY_STATUS: ${{ secrets.YT_PRIVACY_STATUS }}
          YT_LANGUAGE: ${{ secrets.YT_LANGUAGE }}
          YT_CATEGORY_ID: ${{ secrets.YT_CATEGORY_ID }}
          CHANNEL_HANDLE: ${{ secrets.CHANNEL_HANDLE }}
          VIDEO_VOICE: ${{ secrets.VIDEO_VOICE }}
          MUSIC_URL: ${{ secrets.MUSIC_URL }}
          MUSIC_VOLUME: ${{ secrets.MUSIC_VOLUME }}
          TARGET_SECONDS: ${{ secrets.TARGET_SECONDS }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCED_TOPIC: ${{ inputs.topic }}
        run: python main.py

      - name: Upload video and metadata artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasa-video-output-${{ github.run_id }}
          path: |
            output/final.mp4
            output/*.mp4
            output/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Persist topic and publishing state
        if: ${{ success() && inputs.dry_run != true }}
        run: |
          git config user.name "NASA Videos Bot"
          git config user.email "actions@users.noreply.github.com"
          git add used-topics.json config/state.json
          git diff --staged --quiet || git commit -m "chore: persist NASA publishing state [skip ci]"
          git push

      - name: Notify on failure
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          if [ -n "${NOTIFY_WEBHOOK}" ]; then
            python - <<'PY'
            import json, os, urllib.request
            payload = {"content": "NASA Videos pipeline FAILED. Check the GitHub Actions run."}
            req = urllib.request.Request(
                os.environ["NOTIFY_WEBHOOK"],
                data=json.dumps(payload).encode(),
                headers={"Content-Type": "application/json"},
            )
            urllib.request.urlopen(req, timeout=15).read()
            PY
          fi
